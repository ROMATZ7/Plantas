<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantas de mi casa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
  :root{
    --bg:#f1ece2; --card:#fffdf9; --card2:#f6f2ea;
    --ink:#43503b; --soft:#a39a88;
    --sage:#8ea27d; --moss:#5d7150; --brown:#a08a6c; --brown-d:#80694e;
    --water:#7ba89a;
    --line:rgba(67,80,59,.10);
    --shadow:0 14px 34px rgba(93,113,80,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Mulish',sans-serif;color:var(--ink);background:var(--bg);
    padding:26px 16px 70px;min-height:100vh}

  .screen{display:none;max-width:430px;margin:0 auto}
  .screen.on{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- PORTADA ---------- */
  .masthead{text-align:center;margin-bottom:2px}
  .masthead .kicker{font-family:'Mulish';font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--sage);font-weight:600}
  .cover h1{font-family:'Quicksand',sans-serif;font-weight:700;color:var(--moss);
    font-size:clamp(32px,9vw,46px);line-height:1.04;text-align:center;letter-spacing:-.01em;margin:8px 0}
  .date{text-align:center;color:var(--soft);font-size:12.5px;margin:6px 0 24px;text-transform:capitalize;font-weight:500}

  .hero{min-height:calc(100svh - 44px);display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;position:relative}
  .hero h1{font-size:clamp(42px,13vw,66px);margin:10px 0}
  .hero .date{margin:6px 0 0}
  .scroll-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--sage);font-size:22px;
    line-height:1;animation:bob 1.7s ease-in-out infinite}
  .scroll-hint span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
    margin-bottom:4px;font-weight:600}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){.scroll-hint{animation:none}}
  .content{padding-top:4px}

  .panel{background:var(--card);border-radius:24px;padding:20px;margin-bottom:16px;
    box-shadow:var(--shadow);border:1px solid rgba(67,80,59,.05)}
  .panel h2{font-family:'Quicksand',sans-serif;font-size:18px;font-weight:700;color:var(--moss);
    display:flex;align-items:center;gap:10px;margin-bottom:14px}

  .auto-row{display:flex;align-items:center;gap:14px}
  .auto-emoji{font-size:34px;line-height:1}
  .auto-txt{font-size:13.5px;color:#54614b;line-height:1.5}
  .auto-txt b{font-weight:700;color:var(--moss)}

  .water-all{display:block;margin:18px auto 4px;width:64px;height:64px;border-radius:50%;border:none;
    background:linear-gradient(145deg,#a7c2b6,#7ba89a);color:#fff;font-size:28px;cursor:pointer;line-height:1;
    box-shadow:0 8px 18px rgba(123,168,154,.5);transition:transform .15s}
  .water-all:active{transform:scale(.92)}
  .water-all.done{background:linear-gradient(145deg,#a9be8f,#8ea27d);box-shadow:0 8px 18px rgba(142,162,125,.5)}
  .water-cap{display:block;text-align:center;margin-top:9px;font-size:11.5px;letter-spacing:.05em;
    color:var(--soft);font-weight:600}

  .duelist{list-style:none;display:flex;flex-direction:column;gap:9px}
  .duelist li{display:flex;align-items:center;gap:13px;padding:9px;border-radius:16px;cursor:pointer;
    background:var(--card2);transition:transform .15s, background .15s}
  .duelist li:active{transform:scale(.97);background:#eee8dc}
  .duelist img{width:42px;height:42px;border-radius:13px;object-fit:cover;flex:none}
  .duelist .dn{flex:1;font-weight:700;font-size:14px;color:var(--ink)}
  .duelist .db{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .all-ok{font-size:14px;color:var(--sage);font-weight:700;display:flex;align-items:center;gap:9px}

  #notas{width:100%;min-height:84px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:13px;
    font-family:'Mulish';font-size:13.5px;color:#54614b;background:var(--card2);line-height:1.6}
  #notas:focus{outline:none;border-color:var(--sage);background:#fff}

  .open-btn{width:100%;border:none;border-radius:999px;padding:17px;font-family:'Quicksand',sans-serif;
    font-weight:700;font-size:18px;color:#fff;cursor:pointer;margin-top:4px;letter-spacing:.01em;
    background:linear-gradient(145deg,#7d9268,#5d7150);box-shadow:0 10px 24px rgba(93,113,80,.4);transition:transform .15s}
  .open-btn:active{transform:scale(.97)}

  /* ---------- BARAJA ---------- */
  .deckbar{display:flex;gap:9px;margin-bottom:18px}
  .deckbar button{flex:1;border:none;border-radius:999px;padding:11px 8px;font-family:'Mulish';font-weight:700;
    font-size:12.5px;cursor:pointer;color:var(--moss);background:var(--card);box-shadow:0 4px 12px rgba(93,113,80,.12)}
  .deckbar button.active{background:linear-gradient(145deg,#7d9268,#5d7150);color:#fff}
  .stack{padding-top:6px}
  .peek{position:relative;margin-top:-30px;cursor:pointer;transition:transform .22s ease;
    filter:drop-shadow(0 8px 14px rgba(70,90,60,.28))}
  .peek:first-child{margin-top:0}
  .peek:hover{transform:translateY(-7px)}
  .peek-card{background:var(--card);border-radius:22px;padding:9px;border:1px solid rgba(67,80,59,.06)}
  .peek-head{display:flex;align-items:center;gap:13px}
  .peek-thumb{width:52px;height:52px;border-radius:16px;object-fit:cover;flex:none;
    box-shadow:0 0 0 3px var(--c1)}
  .peek-info{flex:1;min-width:0}
  .peek-name{font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;line-height:1.1;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .peek-status{font-size:11.5px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:5px}
  .peek-ps{font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;color:var(--brown);flex:none;text-align:right;padding-right:4px}
  .peek-ps small{font-size:8.5px;display:block;letter-spacing:.08em;color:var(--soft);font-family:'Mulish';font-weight:600}

  /* ---------- OVERLAY ---------- */
  .overlay{position:fixed;inset:0;background:rgba(67,80,59,.55);backdrop-filter:blur(5px);
    display:none;align-items:center;justify-content:center;padding:24px 16px;z-index:50;overflow:auto}
  .overlay.on{display:flex}
  .flipwrap{width:100%;max-width:330px;margin:auto;position:relative;perspective:1500px;
    animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .flip{position:relative;transition:height .4s ease}
  .flip-inner{position:relative;width:100%;transition:transform .6s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
  .flip-inner.flipped{transform:rotateY(180deg)}
  .face{position:absolute;top:0;left:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face-back{transform:rotateY(180deg)}

  .card{background:var(--card);border-radius:26px;padding:7px;box-shadow:0 20px 50px rgba(40,55,35,.45);
    border:1px solid rgba(255,255,255,.5)}
  .inner{background:var(--card);border-radius:20px;padding:17px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-family:'Quicksand',sans-serif;font-weight:700;font-size:24px;line-height:1.02;color:var(--moss)}
  .sci{font-style:italic;font-size:11px;color:var(--soft);margin-top:3px}
  .ps{text-align:right;white-space:nowrap}
  .ps small{font-size:9px;font-weight:600;color:var(--soft);letter-spacing:.08em;display:block}
  .ps b{font-family:'Quicksand';font-size:22px;color:var(--brown)}
  .type{display:inline-block;margin-top:10px;background:var(--c1);color:var(--moss);font-size:11px;font-weight:700;
    letter-spacing:.03em;padding:5px 13px;border-radius:999px}
  .art{margin:13px 0;height:166px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px var(--c1)}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .stats{display:flex;flex-direction:column;margin-top:2px}
  .stat{display:grid;grid-template-columns:20px 60px 1fr;align-items:start;gap:10px;font-size:12.5px;
    border-top:1px solid var(--line);padding:9px 0}
  .stat:first-child{border-top:none}
  .stat .ico{font-size:15px;text-align:center}
  .stat .lab{font-weight:700;color:var(--sage);font-size:11px;letter-spacing:.02em;padding-top:1px}
  .stat .val{color:#54614b;line-height:1.4}

  .flip-btn{width:100%;margin-top:14px;border:none;border-radius:999px;padding:13px;font-family:'Quicksand',sans-serif;
    font-weight:700;font-size:13.5px;cursor:pointer;color:#fff;background:var(--c2);transition:transform .15s}
  .flip-btn:active{transform:scale(.97)}
  .back-title{font-family:'Quicksand',sans-serif;font-weight:700;font-size:22px;color:var(--moss);display:flex;align-items:center;gap:9px}
  .back-sub{font-size:11px;color:var(--soft);margin:3px 0 13px;font-style:italic}
  .statusbox{background:var(--card2);border-radius:16px;padding:12px 14px;font-size:12px;margin-bottom:13px;line-height:1.6}
  .statusbox b{font-weight:700}
  .actions{display:flex;gap:9px}
  .act{flex:1;border:none;border-radius:999px;padding:13px 6px;font-family:'Quicksand',sans-serif;font-weight:700;
    font-size:21px;cursor:pointer;color:#fff;transition:filter .12s, transform .15s;line-height:1}
  .act:active{transform:scale(.96)}
  .act-water{background:linear-gradient(145deg,#8fb3a6,#7ba89a)}
  .act-fert{background:linear-gradient(145deg,#b09a78,#a08a6c)}
  .act.done{filter:brightness(.88)}
  .registro{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
  .reg-col h4{font-family:'Quicksand';font-size:12px;font-weight:700;color:var(--sage);margin-bottom:8px}
  .reg-list{list-style:none;display:flex;flex-direction:column;gap:5px;min-height:20px}
  .reg-list li{font-size:11.5px;color:#54614b;background:var(--card2);border-radius:10px;padding:5px 9px;
    display:flex;justify-content:space-between;gap:4px}
  .reg-list li .n{opacity:.4;font-weight:700}
  .reg-empty{font-size:11.5px;color:var(--soft);font-style:italic;padding:3px 0}
  .reg-foot{font-size:10px;color:var(--soft);text-align:center;margin-top:11px;line-height:1.5}
  .close{position:absolute;top:-12px;right:-6px;width:34px;height:34px;border-radius:50%;background:#fff;
    border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(40,55,35,.35);display:flex;align-items:center;
    justify-content:center;color:var(--moss);z-index:5}
</style>
</head>
<body>

<div class="screen cover on" id="portada">
  <section class="hero">
    <div class="masthead"><div class="kicker">Mi rincon verde</div></div>
    <h1>Plantas de mi casa</h1>
    <div class="date" id="today"></div>
    <div class="scroll-hint" aria-hidden="true"><span>Desliza</span>&#9662;</div>
  </section>

  <section class="content">

  <div class="panel">
    <h2>Riego automatico</h2>
    <div class="auto-row">
      <div class="auto-txt" id="autoTxt">Calculando...</div></div>
    <button class="water-all" id="waterAll">&#128167;</button>
    <span class="water-cap">Regar todas hoy</span>
  </div>

  <div class="panel">
    <h2>Toca regar</h2>
    <ul class="duelist" id="duelist"></ul>
  </div>

  <div class="panel">
    <h2>Notas</h2>
    <textarea id="notas" placeholder="Plagas, trasplantes, ideas..."></textarea>
  </div>

  <button class="open-btn" id="openDeck">&#129516; Abrir mis plantas</button>
  </section>
</div>

<div class="screen" id="deckview">
  <div class="deckbar">
    <button id="backHome">&#8592; Portada</button>
    <button id="sortOrig" class="active">Orden normal</button>
    <button id="sortUrg">&#9889; Urgente</button>
  </div>
  <div class="stack" id="stack"></div>
</div>

<div class="overlay" id="overlay">
  <div class="flipwrap" id="flipwrap">
    <button class="close" aria-label="Cerrar">&times;</button>
    <div class="flip" id="flip"><div class="flip-inner" id="flipInner">
      <div class="face face-front" id="faceFront"></div>
      <div class="face face-back" id="faceBack"></div>
    </div></div>
  </div>
</div>

   riego:"Poco y de sequia. Espera a que se seque del todo.",
   luz:"Pleno sol. Planta mediterranea de pura cepa.",
   sustrato:"Arenoso y muy drenante. Se pudre con exceso de agua.",
   abono:"Lixiviado de humus 1 vez al mes. Cuanto mas pobre el suelo, mas aroma.",meter:"Roca"},
  {name:"Lengua de Suegra",sci:"Dracaena trifasciata",ps:100,type:"Resistente",c1:"#d8d29a",c2:"#7a8a3a",base:16,
   riego:"Poquisimo. Cada 15-20 dias. En invierno, 1 vez al mes. Mata mas el exceso.",
   luz:"Aguanta de todo: desde sombra hasta sol. Super adaptable.",
   sustrato:"Cactus/suculentas o universal con perlita. Drenaje si o si.",
   abono:"Lixiviado de humus 2-3 veces al ano basta.",meter:"Legendaria"},
  {name:"Aloe Vera (hijuelo)",sci:"Aloe vera",ps:88,type:"Suculenta",c1:"#bfe0c8",c2:"#3f8a8a",base:12,
   riego:"Poco. Cada 12-15 dias y solo cuando la tierra este seca del todo.",
   luz:"Mucha luz, sol directo suave. Si se estira o palidece, le falta luz.",
   sustrato:"Tierra de cactus con drenaje. OJO con las canicas por encima: no dejan secar ni ver la tierra. Aparta unas pocas para comprobar humedad antes de regar.",
   abono:"Lixiviado de humus muy diluido, 1 vez al mes en primavera-verano.",meter:"Resistente"},
  {name:"Geranio / Pelargonio",sci:"Pelargonium sp.",ps:80,type:"Florida",c1:"#e8c0a0",c2:"#b2603a",base:4,
   riego:"Moderado. Deja secar entre riegos; las puntas secas son de sed/sol fuerte.",
   luz:"Mucho sol para que florezca. En Sevilla, fenomenal fuera.",
   sustrato:"Universal con drenaje. Quita hojas secas para que rebrote.",
   abono:"Lixiviado de humus cada 2 semanas en primavera-verano.",meter:"Florifera"}
];
const rows=[["\u{1F4A7}","Riego","riego"],["\u2600\uFE0F","Luz","luz"],["\u{1FAB4}","Sustrato","sustrato"],["\u{1F9EA}","Abono","abono"]];

// ---- almacenamiento ----
const mem={};
function lsGet(k){try{const v=localStorage.getItem('pmc_'+k);return v!=null?JSON.parse(v):undefined;}catch(e){return undefined;}}
function lsSet(k,val){try{localStorage.setItem('pmc_'+k,JSON.stringify(val));}catch(e){}}
async function getVal(key,def){
  try{const r=await window.storage.get(key);if(r&&r.value!=null)return JSON.parse(r.value);}catch(e){}
  const l=lsGet(key);if(l!==undefined)return l;
  if(key in mem)return mem[key];
  return def;
}
async function setVal(key,val){
  mem[key]=val;
  lsSet(key,val);
  try{await window.storage.set(key,JSON.stringify(val));}catch(e){}
}

// ---- fechas ----
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(iso){const a=iso.split('-');const d=new Date(+a[0],+a[1]-1,+a[2]);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});}
function daysSince(iso){const a=iso.split('-');const t=new Date(+a[0],+a[1]-1,+a[2]);t.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.round((n-t)/86400000);}

// ---- estacion + temperatura ----
let TEMP=null;
function season(){
  const m=new Date().getMonth();
  if(m===11||m<=1) return {key:'invierno',mult:2.4,emoji:'\u2744\uFE0F',txt:'Invierno suave en Sevilla. Las plantas casi no beben: <b>espacia mucho el riego</b>.'};
  if(m<=4) return {key:'primavera',mult:1.5,emoji:'\u{1F331}',txt:'Primavera. Empiezan a crecer: <b>riego moderado</b> y vuelve el abono.'};
  if(m<=7) return {key:'verano',mult:1.0,emoji:'\u2600\uFE0F',txt:'Verano sevillano, calor fuerte y seco: <b>riega mas seguido</b> y revisa a diario las sedientas.'};
  return {key:'otono',mult:1.5,emoji:'\u{1F342}',txt:'Otono. Baja el ritmo: <b>menos riego</b> segun refresca.'};
}
function tempMult(){
  if(TEMP==null) return 1;
  if(TEMP>=34) return .75;
  if(TEMP>=28) return .88;
  if(TEMP<=10) return 1.5;
  if(TEMP<=15) return 1.25;
  return 1;
}
function interval(i){return Math.max(1,Math.round(plants[i].base*season().mult*tempMult()));}

async function fetchTemp(){
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),3500);
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.39&longitude=-5.99&current=temperature_2m',{signal:c.signal});
    clearTimeout(t);const j=await r.json();
    if(j&&j.current&&typeof j.current.temperature_2m==='number') TEMP=Math.round(j.current.temperature_2m);
  }catch(e){TEMP=null;}
}

// estado de riego de una planta
async function statusOf(i){
  const arr=await getVal('plant:'+i+':riego',[]);
  const iv=interval(i);
  if(arr.length===0) return {state:'none',iv,ds:null,score:9999};
  const ds=daysSince(arr[arr.length-1]);
  const over=ds-iv;
  let state='ok';
  if(over>=0) state='due'; else if(over>=-1) state='soon';
  return {state,iv,ds,score:over,last:arr[arr.length-1]};
}
function badge(st){
  if(st.state==='none') return {dot:'\u{1F534}',txt:'Sin registro',col:'#b23b2e',bg:'#f3d6d0'};
  if(st.state==='due'){const d=st.ds-st.iv;return {dot:'\u{1F534}',txt: d<=0?'Toca regar':('Tarde '+d+' d'),col:'#b23b2e',bg:'#f3d6d0'};}
  if(st.state==='soon') return {dot:'\u{1F7E1}',txt:'Pronto',col:'#9c7a1a',bg:'#f3ead0'};
  return {dot:'\u{1F7E2}',txt:'Faltan '+(st.iv-st.ds)+' d',col:'#3f7a3a',bg:'#d9ecd2'};
}

// ---------- PORTADA ----------
async function renderPortada(){
  document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const s=season();
  const se=document.getElementById('seasonEmoji'); if(se) se.innerHTML=s.emoji;
  let extra = TEMP!=null ? (' Ahora mismo <b>'+TEMP+'\u00B0C</b> en Sevilla.') : '';
  document.getElementById('autoTxt').innerHTML=s.txt+extra;

  const sts=await Promise.all(plants.map((p,i)=>statusOf(i)));
  const due=plants.map((p,i)=>({i,st:sts[i]})).filter(x=>x.st.state==='due'||x.st.state==='none')
    .sort((a,b)=>b.st.score-a.st.score);
  const ul=document.getElementById('duelist');
  if(due.length===0){ul.innerHTML='<div class="all-ok">\u2705 Todo al dia, no toca regar nada hoy</div>';}
  else{ul.innerHTML=due.map(x=>{const b=badge(x.st);return `<li data-i="${x.i}">
      <img src="${IMGS[x.i]}" alt=""><span class="dn">${plants[x.i].name}</span>
      <span class="db" style="color:${b.col};background:${b.bg}">${b.dot} ${b.txt}</span></li>`;}).join('');
    ul.querySelectorAll('li').forEach(li=>li.addEventListener('click',()=>waterOne(+li.dataset.i)));
  }
  const notas=document.getElementById('notas');
  notas.value=await getVal('notas:general','');
}

// regar una sola planta desde "toca regar"
async function waterOne(i){
  const key='plant:'+i+':riego';
  const arr=await getVal(key,[]);
  const hoy=todayISO();
  if(arr[arr.length-1]!==hoy){arr.push(hoy);while(arr.length>MAX)arr.shift();await setVal(key,arr);}
  await renderPortada();
}
let notesT;
document.getElementById('notas').addEventListener('input',e=>{clearTimeout(notesT);notesT=setTimeout(()=>setVal('notas:general',e.target.value),350);});

// regar TODAS hoy de una
document.getElementById('waterAll').addEventListener('click',async function(){
  const hoy=todayISO();
  for(let i=0;i<plants.length;i++){
    const key='plant:'+i+':riego';
    const arr=await getVal(key,[]);
    if(arr[arr.length-1]!==hoy){arr.push(hoy);while(arr.length>MAX)arr.shift();await setVal(key,arr);}
  }
  this.classList.add('done');this.innerHTML='\u2705';
  setTimeout(()=>{this.classList.remove('done');this.innerHTML='\u{1F4A7}';},1600);
  await renderPortada();
});

// ---------- BARAJA ----------
const stack=document.getElementById('stack');
let sortMode='orig';
async function renderDeck(){
  const sts=await Promise.all(plants.map((p,i)=>statusOf(i)));
  let order=plants.map((p,i)=>i);
  if(sortMode==='urg') order.sort((a,b)=>sts[b].score-sts[a].score);
  stack.innerHTML='';
  order.forEach((i,pos)=>{
    const p=plants[i];const b=badge(sts[i]);
    const el=document.createElement('div');
    el.className='peek';
    el.style.setProperty('--c1',p.c1);el.style.setProperty('--c2',p.c2);
    el.style.zIndex=pos+1;
    el.innerHTML=`<div class="peek-card"><div class="peek-head">
      <img class="peek-thumb" src="${IMGS[i]}" alt="">
      <div class="peek-info"><div class="peek-name">${p.name}</div>
        <div class="peek-status" style="color:${b.col}">${b.dot} ${b.txt}</div></div>
      <div class="peek-ps"><small>PS</small>${p.ps}</div>
    </div></div>`;
    el.addEventListener('click',()=>openCard(i));
    stack.appendChild(el);
  });
}

// ---------- NAVEGACION ----------
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
document.getElementById('openDeck').addEventListener('click',async()=>{show('deckview');await renderDeck();});
document.getElementById('backHome').addEventListener('click',async()=>{show('portada');await renderPortada();});
document.getElementById('sortOrig').addEventListener('click',function(){sortMode='orig';this.classList.add('active');document.getElementById('sortUrg').classList.remove('active');renderDeck();});
document.getElementById('sortUrg').addEventListener('click',function(){sortMode='urg';this.classList.add('active');document.getElementById('sortOrig').classList.remove('active');renderDeck();});

// ---------- CARTA ----------
const overlay=document.getElementById('overlay');
const flipwrap=document.getElementById('flipwrap');
const flip=document.getElementById('flip');
const flipInner=document.getElementById('flipInner');
const faceFront=document.getElementById('faceFront');
const faceBack=document.getElementById('faceBack');
let current=-1;
function setHeight(){const a=flipInner.classList.contains('flipped')?faceBack:faceFront;flip.style.height=a.offsetHeight+'px';}

async function openCard(i){
  current=i;const p=plants[i];
  flipwrap.style.setProperty('--c1',p.c1);flipwrap.style.setProperty('--c2',p.c2);
  flipInner.classList.remove('flipped');
  const stats=rows.map(r=>`<div class="stat"><span class="ico">${r[0]}</span><span class="lab">${r[1]}</span><span class="val">${p[r[2]]}</span></div>`).join('');
  faceFront.innerHTML=`<div class="card"><div class="inner">
    <div class="top"><div><div class="name">${p.name}</div><div class="sci">${p.sci}</div></div>
    <div class="ps"><small>PS</small><b>${p.ps}</b></div></div>
    <span class="type">${p.type}</span>
    <div class="art"><img src="${IMGS[i]}" alt="${p.name}"></div>
    <div class="stats">${stats}</div>
    <button class="flip-btn" id="toBack">\u{1F6B0} Ver registro</button>
  </div></div>`;
  faceBack.innerHTML=`<div class="card"><div class="inner">
    <div class="back-title">\u{1F4D3} Registro</div>
    <div class="back-sub">${p.name}</div>
    <div class="statusbox" id="statusbox">...</div>
    <div class="actions">
      <button class="act act-water" data-tipo="riego">\u{1F4A7}</button>
      <button class="act act-fert" data-tipo="abono">\u{1F9EA}</button>
    </div>
    <div class="registro">
      <div class="reg-col"><h4>\u{1F4A7} Riego</h4><ul class="reg-list" id="reg-riego"></ul></div>
      <div class="reg-col"><h4>\u{1F9EA} Abono</h4><ul class="reg-list" id="reg-abono"></ul></div>
    </div>
    <div class="reg-foot">Toca otra vez el mismo dia para deshacer &middot; guarda los ultimos ${MAX}</div>
    <button class="flip-btn" id="toFront">\u{1FAB4} Volver a la carta</button>
  </div></div>`;
  faceFront.querySelector('#toBack').addEventListener('click',e=>{e.stopPropagation();doFlip(true);});
  faceBack.querySelector('#toFront').addEventListener('click',e=>{e.stopPropagation();doFlip(false);});
  faceBack.querySelectorAll('.act').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleDate(i,b.dataset.tipo);}));
  overlay.classList.add('on');
  await renderLogs(i);
  requestAnimationFrame(setHeight);
}
function doFlip(b){flipInner.classList.toggle('flipped',b);setHeight();}

async function renderLogs(i){
  for(const tipo of ['riego','abono']){
    const arr=await getVal('plant:'+i+':'+tipo,[]);
    const ul=faceBack.querySelector('#reg-'+tipo);if(!ul)continue;
    if(arr.length===0){ul.innerHTML='<div class="reg-empty">Sin registros</div>';}
    else{ul.innerHTML=arr.slice().reverse().map((d,idx)=>`<li><span>${fmt(d)}</span><span class="n">${arr.length-idx}</span></li>`).join('');}
  }
  const st=await statusOf(i);const b=badge(st);
  const sb=faceBack.querySelector('#statusbox');
  if(sb){
    let line = st.state==='none' ? 'Aun no has registrado riego.' :
      ('Ultimo riego hace <b>'+st.ds+' d</b>'+(st.ds===1?'':'').replace(' d','')+' &middot; '+fmt(st.last));
    sb.innerHTML=`<div style="color:${b.col};font-weight:700">${b.dot} ${b.txt}</div>
      <div style="margin-top:3px">${line}</div>
      <div style="margin-top:3px;color:#5b6b5e">Sugerido ahora: cada <b>${st.iv} d</b> (${season().key}${TEMP!=null?', '+TEMP+'\u00B0C':''})</div>`;
  }
  setHeight();
}

async function toggleDate(i,tipo){
  const key='plant:'+i+':'+tipo;
  const arr=await getVal(key,[]);
  const hoy=todayISO();
  if(arr[arr.length-1]===hoy){arr.pop();}            // deshacer si ya estaba hoy
  else{arr.push(hoy);while(arr.length>MAX)arr.shift();}
  await setVal(key,arr);
  await renderLogs(i);
}

function close(){overlay.classList.remove('on');current=-1;
  if(document.getElementById('deckview').classList.contains('on'))renderDeck();
  if(document.getElementById('portada').classList.contains('on'))renderPortada();}
document.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();close();});
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
window.addEventListener('resize',()=>{if(current>=0)setHeight();});

// ---- arranque ----
(async()=>{await renderPortada();await fetchTemp();await renderPortada();})();

</script>
